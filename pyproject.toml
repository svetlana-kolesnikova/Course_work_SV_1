[project]
name = "course-work-sv-1"
version = "0.1.0"
description = ""
authors = [
    {name = "Svetlana Kolesnikova",email = "sv.ps1286@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pip (==25.0.1)",
    "wheel (==0.45.1)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "yfinance (>=0.2.63,<0.3.0)"
]

[tool.poetry]
packages = [{include = "course_work_sv_1", from = "src"}]

[tool.poetry.group.dev.dependencies]
requests = "^2.32.3"
pytest = "^8.3.5"
pytest-cov = "^6.1.1"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.2.0"
mypy = "^1.15.0"
black = "^25.1.0"
isort = "^6.0.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.git          # Исключить несколько общих каталогов
                     # в корне проекта
  )/
)
'''

[tool.isort]
# максимальная длина строки
line_length = 119

[tool.coverage.report]
# исключение для покрытия тестами
exclude_also = [
    "if __name__ == .__main__.:",
    ]
